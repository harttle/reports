<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 228" role="img" aria-label="Template engine flow: template and data through LiquidJS to rendered HTML">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgb(28, 85, 170)" flood-opacity="0.25" />
    </filter>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9ca3af" />
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <g filter="url(#shadow)">
      <rect width="460" height="96" rx="10" fill="#2b2b2b" stroke="#404040" stroke-width="1" />
      <circle cx="18" cy="18" r="4.5" fill="#ed6a5e" />
      <circle cx="34" cy="18" r="4.5" fill="#f5bf4f" />
      <circle cx="50" cy="18" r="4.5" fill="#62c655" />
      <text x="20" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
        <tspan fill="#d4d4d4">&lt;</tspan><tspan fill="#9cdcfe">p</tspan><tspan fill="#d4d4d4">&gt;</tspan>
        <tspan fill="#ffffff"> Hello, {{ name | </tspan>
        <tspan fill="#4ec9b0">capitalize</tspan>
        <tspan fill="#ffffff"> }}! </tspan>
        <tspan fill="#d4d4d4">&lt;/</tspan><tspan fill="#9cdcfe">p</tspan><tspan fill="#d4d4d4">&gt;</tspan>
      </text>
    </g>
    <g transform="translate(0, 132)" filter="url(#shadow)">
      <rect width="460" height="96" rx="10" fill="#2b2b2b" stroke="#404040" stroke-width="1" />
      <circle cx="18" cy="18" r="4.5" fill="#ed6a5e" />
      <circle cx="34" cy="18" r="4.5" fill="#f5bf4f" />
      <circle cx="50" cy="18" r="4.5" fill="#62c655" />
      <text x="20" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
        <tspan fill="#9cdcfe">name:</tspan>
        <tspan fill="#ce9178"> "liquid"</tspan>
      </text>
    </g>
  </g>

  <image href="data:image/png;base64," x="562" y="76" width="76" height="76" aria-label="LiquidJS" />

  <g transform="translate(700, 66)" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <g filter="url(#shadow)">
      <rect width="460" height="96" rx="10" fill="#2b2b2b" stroke="#404040" stroke-width="1" />
      <circle cx="18" cy="18" r="4.5" fill="#ed6a5e" />
      <circle cx="34" cy="18" r="4.5" fill="#f5bf4f" />
      <circle cx="50" cy="18" r="4.5" fill="#62c655" />
      <text x="20" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
        <tspan fill="#d4d4d4">&lt;</tspan><tspan fill="#9cdcfe">p</tspan><tspan fill="#d4d4d4">&gt;</tspan>
        <tspan fill="#ffffff">Hello, </tspan>
        <tspan fill="#ffffff">Liquid!</tspan>
        <tspan fill="#ffffff"> </tspan>
        <tspan fill="#d4d4d4">&lt;/</tspan><tspan fill="#9cdcfe">p</tspan><tspan fill="#d4d4d4">&gt;</tspan>
      </text>
    </g>
  </g>

  <g fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M460 48 H512" />
    <path d="M460 180 H512" />
    <path d="M512 48 V180" />
    <path d="M512 114 H562" marker-end="url(#arrowhead)" />
    <path d="M638 114 H700" marker-end="url(#arrowhead)" />
  </g>
</svg>
